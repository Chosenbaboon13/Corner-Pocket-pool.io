<style>

h1{margin:0;font-size:36px}h2{margin:0;font-size:28px}h3{margin:6px 0 0;text-align:left;font-size:16px;color:var(--acc)}p{margin:0}.sub{color:var(--mute)}
.big{background:var(--acc);color:#1b1208;border:0;border-radius:10px;padding:12px;font-size:18px;font-weight:bold}

.ic{font-size:24px;text-align:center}.sw{width:26px;height:26px;border-radius:50%;display:block;margin:auto}

.pl,.mid{background:linear-gradient(160deg,#33261c,#1d1510)}

.wrap{margin:0}
#main{flex:1;min-height:0;display:flex;gap:8px;align-items:stretch}#stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}

@media(max-width:700px){#main{flex-direction:column}.pu.v{flex-direction:row;order:2}.pu.v .sl{width:56px;height:56px;font-size:22px}#stage{order:1}}

#app{max-width:none;height:100vh;height:100dvh;padding:6px 10px;gap:6px}
@media(max-width:640px){.hud{grid-template-columns:1fr 1fr}.mid{grid-column:1/3;order:-1;flex-direction:row;align-items:center;justify-content:space-between}.bar{flex:1}.nm{font-size:15px}.sl{width:50px;height:50px;font-size:21px}.card{padding:14px}}

<div id="app">
 <div class="hud"><div class="pl" id="p0"></div>
  <div class="mid"><div id="tn">30</div><div class="bar"><div id="tb"></div></div><div class="mini"><button id="bm">Pause</button><button id="bf">Full</button></div></div>
  <div class="pl r" id="p1"></div></div>
 <div id="main"><div class="pu v" id="u0"></div><div id="stage"><div class="wrap">

  <div class="ov" id="menu"><div class="card">

   <button class="big" data-m="cpu">Play the CPU</button>
   <div class="seg" id="diff"><button data-d="0">Easy</button><button data-d="1" class="on">Medium</button><button data-d="2">Hard</button></div>

  </div></div>

  <div class="ov h" id="over"><div class="card"><h2 id="ot"></h2><p class="sub" id="od"></p><button class="big" id="rm">Rematch</button><button class="big g" id="om">Main menu</button></div></div>
 </div>
 </div><div class="pu v" id="u1"></div></div>
 <div id="st"></div>
</div>
<script>
const cv=document.getElementById("c"),ctx=cv.getContext("2d");ctx.scale(2,2);
const W=1160,H=520,OX=100,L=50,R=910,T=50,B=470,r=10.5,CY=(T+B)/2,FX=L+(R-L)*.7,TURN=30,TUBE=[-50,1010];
const PK=[[L-6,T-6,28],[R+6,T-6,28],[L-6,B+6,28],[R+6,B+6,28],[480,T-10,29],[480,B+10,29]];
const COL=["#f4f0e6","#f5c400","#1e4fd8","#e0262b","#6a2a9c","#f57a00","#0b8a45","#8a2020","#141414"];
const col=n=>COL[n>8?n-8:n],grp=n=>n<8?0:n>8?1:2,$=id=>document.getElementById(id),rnd=Math.random;
const PW={fire:{n:"Fireball",i:"🔥",d:"Huge power. Balls you hit scatter in flames.",cd:18,c:"#ff7a2a"},
 bolt:{n:"Lightning",i:"⚡",d:"Cue ball moves extremely fast with a lightning trail.",cd:15,c:"#7fe8ff"},
 freeze:{n:"Freeze",i:"❄️",d:"Freezes your opponent’s balls (the 8-ball on an open table) for the shot.",cd:20,c:"#b8ecff"},
 magnet:{n:"Magnet",i:"🧲",d:"Pulls nearby balls toward the cue ball.",cd:22,c:"#ff6fb0"},
 ghost:{n:"Ghost Ball",i:"👻",d:"Cue ball passes through other balls. Never a foul.",cd:20,c:"#d6c8ff"},
 meteor:{n:"Meteor Strike",i:"☄️",d:"Ultimate: a meteor hits and scatters every ball.",cd:60,u:1,c:"#ff5a1f"},
 hole:{n:"Black Hole",i:"🕳️",d:"Ultimate: pulls all balls to the centre, then bursts.",cd:75,u:1,c:"#9b6bff"},
 multi:{n:"Multi Shot",i:"🔱",d:"Splits the cue ball into three that scatter balls.",cd:22,c:"#ffd36b"},
 quake:{n:"Earthquake",i:"🌋",d:"Shockwave shakes the table and nudges every ball.",cd:25,c:"#c98b4a",inst:1},
 prec:{n:"Precision",i:"🎯",d:"Longer guide with a bounce line and bigger pockets for the shot.",cd:16,c:"#7cffb2"},
 time:{n:"Time Control",i:"⏳",d:"Ultimate: +20s on the clock and your next shot plays in slow motion.",cd:70,u:1,inst:1,c:"#6fd3ff"}};
const CUE={wood:["#7a4a22","#e8c88a","Classic Wood"],fire:["#7a1c0b","#ff8a2a","Inferno Cue"],ice:["#2a5f8f","#bfefff","Frost Cue"],galaxy:["#2a1060","#c28cff","Galaxy Cue"]};
const CLOTH={green:["#34a35f","#1f7544","#1b5e33","Classic Green"],blue:["#3a7fd0","#1f4f94","#1a3f78","Tournament Blue"],crimson:["#c04050","#8a2433","#6e1c2a","Crimson Club"],neon:["#7a3cff","#3a1a99","#2a1272","Neon Arcade"]};
const ARENA={a_hall:["#2a1a10","#0c0705","#f0b94a","Luxury Pool Hall"],a_neon:["#120626","#04020c","#ff3cf0","Neon Arcade"],a_pit:["#1d1d20","#060607","#9aa0a8","Underground Arena"]};
const PRICE={a_neon:250,a_pit:350,multi:150,quake:150,prec:100,time:400,magnet:120,ghost:120,hole:350,fire_c:200,ice:250,galaxy:400,blue:150,crimson:150,neon:300};
const KEYS=[["q","e","r","f"],["i","o","p","l"]];
let SV={coins:200,xp:0,own:{fire:1,bolt:1,freeze:1,meteor:1,wood:1,green:1,a_hall:1},cue:"wood",cloth:"green",arena:"a_hall",ms:{d:"",p:{},c:{}},ach:{},used:{},lb:[],load:{n:["fire","bolt","freeze"],u:"meteor"},st:{m:0,w:0,b:0,s:0,best:0},daily:"",ds:0,set:{mv:.5,sv:.7,mm:0,sm:0}};
try{const x=JSON.parse(localStorage.getItem("cpp")||"{}");SV={...SV,...x,set:{...SV.set,...x.set}}}catch(e){}
const save=()=>{const j=JSON.stringify(SV);try{localStorage.setItem("cpp",j)}catch(e){}try{window.CGDATA&&window.CGDATA.setItem("cpp",j)}catch(e){}},lvl=()=>Math.floor(SV.xp/120)+1;
const S={mode:"cpu",diff:1,state:"menu",balls:[],turn:0,groups:[null,null],time:TURN,drag:null,mouse:{x:480,y:260},msg:"",msgT:0,first:null,pot:[],hand:false,cpuT:0,cpuShot:null,mod:{},anims:[],fx:[],stack:[[],[]],pw:[],shake:0,flash:0};
const slots=()=>[...SV.load.n,SV.load.u].filter(Boolean);
const human=()=>S.mode=="pvp"||S.turn==0,name=i=>S.mode=="cpu"?(i?"CPU":"You"):"Player "+(i+1);
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const say=t=>{S.msg=t;S.msgT=2.8};

/* ---------- audio ---------- */
const A={ac:null};let nb=null,mi=0,mnext=0;
function tone(f,d,ty,v,f2){if(!A.ac||SV.set.sm||A.cg)return;const t=A.ac.currentTime,o=A.ac.createOscillator(),g=A.ac.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(Math.max(.0001,v*SV.set.sv),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(A.ac.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,fq){if(!A.ac||SV.set.sm||A.cg)return;if(!nb){nb=A.ac.createBuffer(1,A.ac.sampleRate*.5,A.ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=rnd()*2-1}const s=A.ac.createBufferSource(),g=A.ac.createGain(),f=A.ac.createBiquadFilter(),t=A.ac.currentTime;f.type="bandpass";f.frequency.value=fq;s.buffer=nb;g.gain.setValueAtTime(Math.max(.0001,v*SV.set.sv),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(A.ac.destination);s.start()}
function sfx(k,v=1){v=Math.min(1,v);const q={cue:()=>{noise(.06,.6,2200);tone(150,.1,"sine",.6)},ball:()=>{tone(650+rnd()*300,.06,"triangle",.5*v);noise(.04,.4*v,3200)},wall:()=>tone(110,.08,"sine",.35*v),pocket:()=>tone(320,.3,"sine",.5,70),thud:()=>{tone(95,.14,"sine",.7,45);noise(.05,.3,500)},pow:()=>tone(300,.3,"sawtooth",.25,1300),ult:()=>{tone(70,.9,"sawtooth",.35,500);noise(.7,.6,300)},win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,"triangle",.4),i*140)),lose:()=>[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.3,"sawtooth",.25),i*180)),buy:()=>{tone(900,.08,"square",.25);setTimeout(()=>tone(1350,.12,"square",.25),80)},no:()=>tone(140,.15,"square",.2),tick:()=>tone(600,.1,"square",.25),go:()=>tone(900,.3,"square",.3)};(q[k]||(()=>{}))()}
const SC={menu:{st:.3,root:98,b:[0,0,-5,-5,-3,-3,-5,-5],l:[12,15,19,15,17,15,12,14]},game:{st:.18,root:82.4,b:[0,0,5,5,3,3,7,7],l:[12,15,19,24,22,19,15,17]}};
function note(t,f,d,ty,v){const o=A.ac.createOscillator(),g=A.ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(Math.max(.0001,v*SV.set.mv),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(A.ac.destination);o.start(t);o.stop(t+d+.02)}
setInterval(()=>{if(!A.ac)return;const m=SC[S.state=="menu"?"menu":"game"];if(mnext<A.ac.currentTime)mnext=A.ac.currentTime+.05;
 while(mnext<A.ac.currentTime+.25){if(!SV.set.mm&&!A.cg){const i=mi%8;note(mnext,m.root*2**(m.b[i]/12),m.st*1.7,"triangle",.12);if(mi%2==0||m.st<.2)note(mnext,m.root*2**(m.l[i]/12)*2,m.st,"square",.035)}mi++;mnext+=m.st}},80);

/* ---------- game setup ---------- */
function newGame(){
 const so=sh([1,2,3,4,5,6,7]),st=sh([9,10,11,12,13,14,15]),rest=sh([...so.slice(1),...st.slice(1)]),o=[];o[4]=8;o[10]=so[0];o[14]=st[0];
 let k=0;for(let i=0;i<15;i++)if(o[i]==null)o[i]=rest[k++];
 S.balls=[{n:0,x:L+215,y:CY,vx:0,vy:0,in:0}];
 let i=0;for(let row=0;row<5;row++)for(let j=0;j<=row;j++)S.balls.push({n:o[i++],x:FX+row*(r*1.74+.3),y:CY+(j-row/2)*(2*r+.4),vx:0,vy:0,in:0});
 Object.assign(S,{turn:0,groups:[null,null],hand:false,sig:"",anims:[],fx:[],stack:[[],[]],mod:{},hole:null,free:false,shake:0,flash:0});
 S.pw=[0,1].map(()=>({cd:{},armed:null}));S.pw.forEach(p=>{if(SV.load.u)p.cd[SV.load.u]=25});
 for(const p of[0,1]){const el=$("u"+p);el.innerHTML=slots().map((id,i)=>`<button class="sl ${PW[id].u?"ul":""}" data-p="${p}" data-i="${i}" title="${PW[id].n}: ${PW[id].d}"><b>${PW[id].i}</b><em>${PW[id].n}</em><small>${KEYS[p][i].toUpperCase()}</small><span class="cd"></span></button>`).join("")}
}
function start(mode){gp(1);S.mode=mode;newGame();["menu","over","modal"].forEach(x=>$(x).classList.add("h"));S.state="count";S.cnt=3.4;S.lc=4}
function showMenu(){gp(0);S.state="menu";$("menu").classList.remove("h");$("over").classList.add("h");$("modal").classList.add("h");$("mi").textContent="Level "+lvl()+" · "+SV.coins+" Pool Coins"}
function valid(x,y){return x>=L+r&&x<=R-r&&y>=T+r&&y<=B-r&&!S.balls.some(b=>b.n&&!b.in&&Math.hypot(b.x-x,b.y-y)<2*r+1)}
function sd(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy||1;let t=((px-x1)*dx+(py-y1)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-x1-t*dx,py-y1-t*dy)}
const blocked=(x1,y1,x2,y2,ex)=>S.balls.some(b=>!b.in&&b.n&&b!==ex&&sd(b.x,b.y,x1,y1,x2,y2)<2*r-1);
function targets(p){const live=S.balls.filter(b=>b.n&&!b.in),g=S.groups[p];if(g==null)return live.filter(b=>b.n!=8);const own=live.filter(b=>grp(b.n)==g);return own.length?own:live.filter(b=>b.n==8)}
function plan(c){
 let best=null;const tg=targets(S.turn);
 for(const t of tg)for(const p of PK){
  const px=p[0]+(p[0]<480?10:p[0]>480?-10:0),py=p[1]+(p[1]<CY?10:-10),ux=px-t.x,uy=py-t.y,ul=Math.hypot(ux,uy),gx=t.x-ux/ul*2*r,gy=t.y-uy/ul*2*r,dx=gx-c.x,dy=gy-c.y,dl=Math.hypot(dx,dy);
  if(dl<1)continue;const cut=(dx*ux+dy*uy)/(dl*ul);if(cut<.25||blocked(c.x,c.y,gx,gy,t)||blocked(t.x,t.y,px,py,t))continue;
  const sc=cut*2-(dl+ul)/900;if(!best||sc>best.sc)best={sc,a:Math.atan2(dy,dx),f:Math.min(.95,Math.max(.3,.3+(dl+ul)/1300))};
 }
 if(!best&&tg.length){let t=tg[0],m=1e9;for(const b of tg){const d=Math.hypot(b.x-c.x,b.y-c.y);if(d<m){m=d;t=b}}best={sc:-9,a:Math.atan2(t.y-c.y,t.x-c.x),f:.55}}
 return best;
}
function beginTurn(){
 S.time=TURN;S.fresh=0;S.drag=null;
 if(S.mode=="cpu"&&S.turn==1){
  const c=S.balls[0];
  if(S.hand){let best=null;for(let i=0;i<70;i++){const x=L+r+rnd()*(R-L-2*r),y=T+r+rnd()*(B-T-2*r);if(!valid(x,y))continue;const s=plan({x,y});if(s&&(!best||s.sc>best.s.sc))best={x,y,s}}
   if(best){c.x=best.x;c.y=best.y}else{c.x=L+215;c.y=CY}c.in=0;S.hand=false}
  S.cpuShot=plan(c)||{a:rnd()*6.28,f:.5};S.cpuT=1.2;S.state="cpu";
  const rd=SV.load.n.filter(id=>!(S.pw[1].cd[id]>0)&&!PW[id].inst);if(rd.length&&rnd()<.35)S.pw[1].armed=rd[Math.floor(rnd()*rd.length)];
 }else S.state=S.hand?"place":"aim";
}

/* ---------- effects & powers ---------- */
function boom(x,y,c,n){for(let i=0;i<n;i++){const a=rnd()*6.28,s=1+rnd()*4;S.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:25+rnd()*25,m:50,c})}}
function fire(a,f){
 const c=S.balls[0],P=S.pw[S.turn],id=P.armed;S.mod={};S.fh=0;
 let sp=.5+6.2*Math.max(0,Math.min(1,f));
 if(id){S.mod[id]=1;P.cd[id]=PW[id].cd;P.armed=null;usePow(id);sfx("pow");say(PW[id].n+"!");

 if(S.hole){const k=1-S.hole.t/2.4;g=ctx.createRadialGradient(480,CY,2,480,CY,50+k*40);g.addColorStop(0,"#000");g.addColorStop(.6,"#2a0f66");g.addColorStop(1,"rgba(155,107,255,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(480,CY,90,0,7);ctx.fill()}
 const c=S.balls[0],hp=S.state=="place"&&human();
 for(const b of S.balls){if(b.in||(hp&&b.n==0))continue;ball(b,b.x,b.y)}
 if(hp){const x=Math.max(L+r,Math.min(R-r,S.mouse.x)),y=Math.max(T+r,Math.min(B-r,S.mouse.y));ctx.globalAlpha=valid(x,y)?.8:.3;ball(c,x,y);ctx.globalAlpha=1}
 if(S.mod.magnet&&!c.in){ctx.strokeStyle="rgba(255,111,176,.5)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,190,0,7);ctx.stroke()}
 for(const f of S.fx){ctx.globalAlpha=Math.max(0,f.l/f.m);ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;
 if(S.state=="aim"&&human()&&S.drag){
  const v={x:S.drag.sx-S.drag.x,y:S.drag.sy-S.drag.y},l=Math.hypot(v.x,v.y);
  if(l>12){const f=Math.min(l,160)/160;drawAim(c,Math.atan2(v.y,v.x),f);ctx.fillStyle="#0007";ctx.fillRect(L,B+28,200,8);ctx.fillStyle=f>.8?"#e8573f":"#f0b94a";ctx.fillRect(L,B+28,200*f,8)}
 }else if(S.state=="cpu"&&S.cpuShot)drawAim(c,S.cpuShot.a,S.cpuShot.f);
 tube(0);tube(1);
 for(const a of S.anims){if(a.ph==0){ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.quadraticCurveTo((a.sx+TUBE[a.own])/2,-25,TUBE[a.own],36);ctx.stroke()}ball({n:a.n},a.x,a.y)}
 if(S.state=="count"){const k=Math.ceil(S.cnt-.4);ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,0,960,H);ctx.fillStyle="#f0b94a";ctx.font="bold 120px Georgia";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(k>0?k:"BREAK!",480,CY)}
 if(S.fin&&S.state=="roll"){ctx.fillStyle="#f0b94a";ctx.font="bold 28px Georgia";ctx.textAlign="center";ctx.fillText("FINAL SHOT",480,34)}
 if(S.flash>0){ctx.fillStyle="rgba(255,240,210,"+S.flash*.7+")";ctx.fillRect(0,0,960,H)}
 ctx.restore();
}

/* ---------- HUD ---------- */
function hud(){
 const sig=S.turn+"|"+S.groups+"|"+S.mode+"|"+S.state+"|"+S.balls.map(b=>b.in?1:0).join("");
 if(sig!=S.sig){S.sig=sig;
  for(let i=0;i<2;i++){const g=S.groups[i],el=$("p"+i);el.classList.toggle("on",S.turn==i&&S.state!="menu");let d="";
   if(g!=null)for(const b of S.balls)if(b.n&&b.n!=8&&grp(b.n)==g)d+=`<i class="${b.in?"x":""}" style="--c:${col(b.n)}${g?";background:linear-gradient(#f4f0e6 28%,"+col(b.n)+" 28% 72%,#f4f0e6 72%)":""}"></i>`;
   el.innerHTML=`<div class="nm">${name(i)}</div><div class="gr">${g==null?"Open table":g?"Stripes":"Solids"}</div><div class="dots">${d}</div>`}}
 document.querySelectorAll(".sl").forEach(el=>{
  const p=+el.dataset.p,id=slots()[+el.dataset.i],P=S.pw[p];if(!P||!id)return;const cd=P.cd[id]||0,mine=S.turn==p&&S.state=="aim";
  const k="sl "+(PW[id].u?"ul ":"")+(cd>0?"cdn":P.armed==id?"ar":"rd")+(mine?"":" off"),tx=cd>0?Math.ceil(cd):"";
  if(el.dataset.k!=k+tx){el.dataset.k=k+tx;el.className=k;el.querySelector(".cd").textContent=tx}});
 const cpu=S.state=="cpu";$("tn").textContent=cpu?"CPU":Math.max(0,Math.ceil(S.time));$("tn").className=!cpu&&S.time<=8?"w":"";$("tb").style.width=(cpu?100:Math.max(0,S.time/TURN*100))+"%";
 const t=S.msgT>0?S.msg:S.state=="aim"?(human()?"Drag back from anywhere, release to shoot. Q E R F for powers":""):S.state=="place"?"Ball in hand: tap the table to place the cue ball":cpu?"CPU is lining up a shot…":"";
 if($("st").textContent!=t)$("st").textContent=t;$("st").className=S.msgT>0?"m":"";
}

/* ---------- menus ---------- */
const ITEMS=[...Object.entries(PW).map(([id,p])=>({id,k:p.u?"u":"n",n:p.n,d:p.d,ic:p.i,pr:PRICE[id]||0})),
 ...Object.entries(CUE).map(([id,c])=>({id,k:"cue",n:c[2],d:"Cue skin with matching shot trail",sw:c[1],pr:PRICE[id=="fire"?"fire_c":id]||0})),
 ...Object.entries(CLOTH).map(([id,c])=>({id:id,k:"cloth",n:c[3],d:"Table cloth",sw:c[0],pr:PRICE[id]||0})),
 ...Object.entries(ARENA).map(([id,a])=>({id,k:"arena",n:a[3],d:"Room lighting and atmosphere",sw:a[2],pr:PRICE[id]||0}))];
function shopHTML(){
 const sec=(t,k)=>"<h3>"+t+"</h3>"+ITEMS.filter(i=>i.k==k).map(i=>{
  const own=SV.own[i.id],eq=i.k=="n"?SV.load.n.includes(i.id):i.k=="u"?SV.load.u==i.id:i.k=="cue"?SV.cue==i.id:i.k=="arena"?SV.arena==i.id:SV.cloth==i.id;
  return `<div class="row"><span class="ic">${i.ic||`<i class="sw" style="background:${i.sw}"></i>`}</span><div><b>${i.n}</b><small>${i.d}</small></div><button data-buy="${i.id}" class="${eq?"eq":""}">${!own?"Buy "+i.pr:eq?(i.k=="n"?"Equipped (remove)":"Equipped"):"Equip"}</button></div>`}).join("");
 return `<h2>Shop</h2><p class="sub">${SV.coins} Pool Coins · Level ${lvl()}. Loadout: ${SV.load.n.map(i=>PW[i].i).join(" ")} | ${SV.load.u?PW[SV.load.u].i:"none"}. Two-player matches give both players the same loadout.</p>`+sec("Power-ups (equip up to 3)","n")+sec("Ultimates (equip 1)","u")+sec("Cues","cue")+sec("Tables","cloth")+sec("Arenas","arena");
}
function buy(id){
 const it=ITEMS.find(x=>x.id==id);if(!SV.own[id]){if(SV.coins<it.pr){sfx("no");return}SV.coins-=it.pr;SV.own[id]=1;sfx("buy")}
 if(it.k=="n"){const l=SV.load.n,i=l.indexOf(id);if(i>=0)l.splice(i,1);else{if(l.length>=3)l.shift();l.push(id)}}else if(it.k=="u")SV.load.u=id;else if(it.k=="cue")SV.cue=id;else if(it.k=="arena")SV.arena=id;else SV.cloth=id;
 buildSlots();save();openModal("shop");
}
function openModal(k){
 const s=SV.set,st=SV.st,today=new Date().toDateString();let h="";
 if(k=="shop")h=shopHTML();
 else if(k=="set")h=`<h2>Settings</h2><label>Music <input type="range" data-s="mv" min="0" max="1" step=".05" value="${s.mv}"></label><label>Sound effects <input type="range" data-s="sv" min="0" max="1" step=".05" value="${s.sv}"></label><label>Mute music <input type="checkbox" data-s="mm" ${s.mm?"checked":""}></label><label>Mute sound effects <input type="checkbox" data-s="sm" ${s.sm?"checked":""}></label>`;
 else h=`<h2>Rewards & stats</h2><p class="sub">Level ${lvl()} · ${SV.xp%120}/120 XP · ${SV.coins} Pool Coins</p><div class="row"><span class="ic">🎁</span><div><b>Daily reward</b><small>${SV.daily==today?"Claimed today. Come back tomorrow.":"Streak bonus grows for 7 days"}</small></div><button data-daily="1" ${SV.daily==today?"disabled":""}>Claim</button></div><p>Matches ${st.m} · Wins ${st.w} · Balls potted ${st.b}<br>Win streak ${st.s} · Best streak ${st.best} · Daily streak ${SV.ds}</p>`;
 if(k=="stats")h+=extraHTML();$("mb").innerHTML=h;$("modal").classList.remove("h");
}
function buildSlots(){for(const p of[0,1])$("u"+p).innerHTML=slots().map((id,i)=>`<button class="sl ${PW[id].u?"ul":""}" data-p="${p}" data-i="${i}" title="${PW[id].n}: ${PW[id].d}"><b>${PW[id].i}</b><em>${PW[id].n}</em><small>${KEYS[p][i].toUpperCase()}</small><span class="cd"></span></button>`).join("")}
function pauseGame(){if(S.state=="menu"||S.state=="over")return;if(S.state=="pause")return resume();S.prev=S.state;gp(0);S.state="pause";S.drag=null;$("mb").innerHTML='<h2>Paused</h2><button class="big" data-act="res">Resume</button><button class="big alt" data-act="rst">Restart match</button><button class="big g" data-act="quit">Quit to main menu</button>';$("modal").classList.remove("h")}
function resume(){gp(1);$("modal").classList.add("h");S.state=S.prev}
const MS=[{id:"pot",t:"Pot 10 balls",g:10,r:60},{id:"win",t:"Win 2 matches",g:2,r:80},{id:"pow",t:"Use 4 power-ups",g:4,r:50}];
const AC=[{id:"w1",t:"First win",f:()=>SV.st.w>=1},{id:"w5",t:"Win 5 matches",f:()=>SV.st.w>=5},{id:"b50",t:"Pot 50 balls",f:()=>SV.st.b>=50},{id:"s3",t:"3-win streak",f:()=>SV.st.best>=3},{id:"pw",t:"Try 5 different power-ups",f:()=>Object.keys(SV.used).length>=5},{id:"lv5",t:"Reach level 5",f:()=>lvl()>=5}];
function bump(k,n=1){const d=new Date().toDateString();if(SV.ms.d!=d)SV.ms={d,p:{},c:{}};SV.ms.p[k]=(SV.ms.p[k]||0)+n;MS.forEach(m=>{if(m.id==k&&!SV.ms.c[m.id]&&SV.ms.p[k]>=m.g){SV.ms.c[m.id]=1;SV.coins+=m.r;say("Mission complete: "+m.t+" (+"+m.r+" coins)")}});ach()}
function ach(){AC.forEach(a=>{if(!SV.ach[a.id]&&a.f()){SV.ach[a.id]=1;SV.coins+=40;say("Achievement: "+a.t+" (+40 coins)")}});save()}
function usePow(id){if(S.turn==0||S.mode=="pvp"){SV.used[id]=1;bump("pow")}}
function extraHTML(){const m=SV.ms.d==new Date().toDateString()?SV.ms:{p:{},c:{}},row=(i,t,s)=>`<div class="row"><span class="ic">${i}</span><div><b>${t}</b><small>${s}</small></div><span></span></div>`;
 return "<h3>Daily missions</h3>"+MS.map(x=>row(m.c[x.id]?"✅":"🎯",x.t,Math.min(x.g,m.p[x.id]||0)+"/"+x.g+", reward "+x.r+" coins")).join("")+"<h3>Achievements</h3>"+AC.map(a=>row(SV.ach[a.id]?"🏆":"🔒",a.t,SV.ach[a.id]?"Unlocked":"+40 coins")).join("")+"<h3>Leaderboard (this device)</h3>"+(SV.lb.length?SV.lb.map((e,i)=>row(i+1,e.s+" pts",e.d)).join(""):"<p class='sub'>Finish a match to set a score.</p>")}
const closeModal=()=>{if(S.state=="pause")return resume();buildSlots();$("modal").classList.add("h");$("mi").textContent="Level "+lvl()+" · "+SV.coins+" Pool Coins";save()};

/* ---------- input ---------- */
const pt=e=>{const q=cv.getBoundingClientRect();return{x:(e.clientX-q.left)*W/q.width-OX,y:(e.clientY-q.top)*H/q.height}};
const wake=()=>{if(!A.ac)try{A.ac=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}if(A.ac&&A.ac.state=="suspended")A.ac.resume()};
cv.addEventListener("pointerdown",e=>{wake();const p=pt(e);S.mouse=p;
 if(S.state=="place"&&human()){if(valid(p.x,p.y)){const c=S.balls[0];c.x=p.x;c.y=p.y;c.in=0;S.hand=false;S.state="aim"}}
 else if(S.state=="aim"&&human()){S.drag={sx:p.x,sy:p.y,x:p.x,y:p.y};cv.setPointerCapture(e.pointerId)}});
cv.addEventListener("pointermove",e=>{const p=pt(e);S.mouse=p;if(S.drag){S.drag.x=p.x;S.drag.y=p.y}});
cv.addEventListener("pointerup",()=>{const d=S.drag;if(!d||S.state!="aim")return;S.drag=null;const vx=d.sx-d.x,vy=d.sy-d.y,l=Math.hypot(vx,vy);if(l>12)fire(Math.atan2(vy,vx),Math.min(l,160)/160)});
cv.addEventListener("pointercancel",()=>{S.drag=null});
document.addEventListener("keydown",e=>{wake();const k=e.key.toLowerCase();if(k=="escape")return $("modal").classList.contains("h")?pauseGame():closeModal();
 for(let p=0;p<2;p++){const i=KEYS[p].indexOf(k);if(i>=0&&(p==0||S.mode=="pvp"))activate(p,i)}});
document.querySelectorAll(".pu").forEach(el=>el.addEventListener("click",e=>{wake();const b=e.target.closest(".sl");if(b)activate(+b.dataset.p,+b.dataset.i)}));
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{wake();start(b.dataset.m)});
document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{wake();openModal(b.dataset.o)});
document.querySelectorAll("#diff button").forEach(b=>b.onclick=()=>{S.diff=+b.dataset.d;document.querySelectorAll("#diff button").forEach(x=>x.classList.toggle("on",x===b))});
$("mb").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.act){const a=b.dataset.act;if(a=="res")resume();else if(a=="rst")start(S.mode);else showMenu();return}
 if(b.dataset.buy)buy(b.dataset.buy);
 else if(b.dataset.daily){const t=new Date().toDateString();if(SV.daily==t)return;SV.ds=SV.daily==new Date(Date.now()-864e5).toDateString()?SV.ds+1:1;SV.daily=t;SV.coins+=50+25*Math.min(SV.ds,7);sfx("buy");save();openModal("stats")}});
$("mb").addEventListener("input",e=>{const k=e.target.dataset.s;if(k)SV.set[k]=e.target.type=="checkbox"?(e.target.checked?1:0):+e.target.value;save()});
$("mc").onclick=closeModal;$("rm").onclick=()=>start(S.mode);$("om").onclick=showMenu;$("bm").onclick=pauseGame;$("bf").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};

newGame();showMenu();
function fit(){const s=$("stage"),w=Math.min(s.clientWidth,s.clientHeight*W/H),wr=document.querySelector(".wrap");wr.style.width=w+"px";wr.style.height=w*H/W+"px"}
let CG=null,gpOn=0;
function gp(on){try{if(CG&&on!=gpOn){gpOn=on;on?CG.game.gameplayStart():CG.game.gameplayStop()}}catch(e){}}
async function cgInit(){try{if(!(window.CrazyGames&&window.CrazyGames.SDK))return;await window.CrazyGames.SDK.init();CG=window.CrazyGames.SDK;window.CGDATA=CG.data;
 const d=CG.data.getItem("cpp");if(d){const x=JSON.parse(d);SV={...SV,...x,set:{...SV.set,...x.set}}}
 try{A.cg=!!CG.game.settings.muteAudio;CG.game.addSettingsChangeListener(s=>{A.cg=!!s.muteAudio})}catch(e){}
 if(S.state=="menu"){buildSlots();showMenu()}}catch(e){}}
new ResizeObserver(fit).observe($("stage"));fit();cgInit();
let last=0,acc=0;
(function loop(t){const dt=Math.min(.1,(t-last)/1000||0);last=t;acc+=dt;while(acc>=1/60){acc-=1/60;tick(1/60)}draw();hud();requestAnimationFrame(loop)})(0);
</script></body></html>
